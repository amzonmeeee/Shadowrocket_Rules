# HK_Rules
# 自用香港分流：只代理香港未提供官方支援的 AI 服務，其餘一律直連。
#
# 使用方式：在 Shadowrocket 中匯入此配置，並把 PROXY 替換成你的代理策略名稱（如需）。
# Shadowrocket 會按 [Rule] 由上至下匹配；最後一條 FINAL,DIRECT 是全域直連兜底。
#
# 目前納入：OpenAI / ChatGPT、Anthropic / Claude。
# 如服務在香港恢復官方支援，請刪除對應規則，避免不必要地使用代理。

[General]
ipv6 = false
prefer-ipv6 = false
udp-policy-not-supported-behaviour = REJECT
block-quic = all-proxy
update-url = https://raw.githubusercontent.com/amzonmeeee/Shadowrocket_Rules/main/HK_Rules.conf

[Rule]

# 本機與區域網路：保持直連。
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT

# OpenAI / ChatGPT / Sora。
DOMAIN-SUFFIX,chat.com,PROXY
DOMAIN-SUFFIX,chatgpt.com,PROXY
DOMAIN-SUFFIX,chatgpt.site,PROXY
DOMAIN-SUFFIX,chat.openai.com,PROXY
DOMAIN-SUFFIX,openai.com,PROXY
DOMAIN-SUFFIX,oaistatic.com,PROXY
DOMAIN-SUFFIX,oaistatsig.com,PROXY
DOMAIN-SUFFIX,oaiusercontent.com,PROXY
DOMAIN-SUFFIX,sora.com,PROXY

# OpenAI 專用的語音、驗證及內容主機；共用供應商網域不作整站代理。
DOMAIN,chatgpt.livekit.cloud,PROXY
DOMAIN,openai-api.arkoselabs.com,PROXY
DOMAIN,chat.openai.com.cdn.cloudflare.net,PROXY
DOMAIN,openai.com.cdn.cloudflare.net,PROXY
DOMAIN,openaiapi-site.azureedge.net,PROXY
DOMAIN,openaiassets.blob.core.windows.net,PROXY
DOMAIN,openaicom-api-bdcpf8c6d2e9atf6.z01.azurefd.net,PROXY
DOMAIN,openaicom.imgix.net,PROXY
DOMAIN,openaicomproductionae4b.blob.core.windows.net,PROXY
DOMAIN,production-openaicom-storage.azureedge.net,PROXY
DOMAIN-KEYWORD,chatgpt-async-webps-prod,PROXY

# Anthropic / Claude。
DOMAIN-SUFFIX,claude.ai,PROXY
DOMAIN-SUFFIX,claude.com,PROXY
DOMAIN-SUFFIX,claude.app,PROXY
DOMAIN-SUFFIX,clau.de,PROXY
DOMAIN-SUFFIX,claudemcpclient.com,PROXY
DOMAIN-SUFFIX,claudeusercontent.com,PROXY
DOMAIN-SUFFIX,claudemcpcontent.com,PROXY
DOMAIN-SUFFIX,anthropic.com,PROXY
DOMAIN-SUFFIX,anthropic.ai,PROXY

# Anthropic 專用的舊式登入／網站內容主機。
DOMAIN,anthropic.auth0.com,PROXY
DOMAIN,anthropic.com.cdn.cloudflare.net,PROXY
DOMAIN,servd-anthropic-website.b-cdn.net,PROXY

# Anthropic 官方接入 IP：只處理已知目標 IP，不為其他網域額外解析 DNS。
IP-CIDR,160.79.104.0/23,PROXY,no-resolve
IP-CIDR6,2607:6bc0::/48,PROXY,no-resolve

# 其他所有流量：直連。
FINAL,DIRECT
